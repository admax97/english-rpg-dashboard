services:
  - type: web
    name: english-rpg-api
    runtime: node
    rootDir: english-rpg-dashboard
    buildCommand: npm install
    startCommand: npm run server
    envVars:
      - key: NODE_VERSION
        value: 22.12.0
      - key: DB_PATH
        value: /data/database.db
      - key: JWT_SECRET
        generateValue: true
    disk:
      name: english-rpg-data
      mountPath: /data
      sizeGB: 1
